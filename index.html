<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speak&Smile · Сегодня</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6C3FC5">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --p:#6C3FC5; --p2:#4A2E85; --y:#F5C842; --bg:#F6F2FC; --white:#fff;
  --text:#1A1A2E; --muted:#7A7A9A; --line:#ECE6F6; --ok:#2E9E5B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--p);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 16px rgba(74,46,133,.25)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:34px;height:34px;background:var(--y);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px}
.brand h1{font-size:17px;font-weight:800;letter-spacing:-.2px}
.brand .sub{font-size:11px;color:rgba(255,255,255,.7)}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav button,.nav input{font-family:inherit;font-size:13px;border:none;border-radius:8px;padding:8px 12px;cursor:pointer}
.nav .arrowbtn{background:rgba(255,255,255,.16);color:#fff;font-weight:700;min-width:38px}
.nav .today{background:var(--y);color:#4A2E85;font-weight:700}
.nav input[type=date]{background:#fff;color:var(--text)}
.dayhead{flex:1;min-width:160px;font-weight:800;font-size:14px;text-align:center}
.dayhead .wl{display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,.7)}
main{padding:14px 12px 50px;max-width:760px;margin:0 auto}
.banner{background:#fff7df;border:1px solid #f0dd9a;color:#7a5b00;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(108,63,197,.08);margin-bottom:10px;overflow:hidden;border-left:4px solid var(--p)}
.card.noktp,.card.nolesson,.card.holiday{border-left-color:#d6cfe6;opacity:.85}
.card.done{border-left-color:var(--ok)}
/* мягкая подсветка по кабинетам */
.card[data-room="Discovery"]{background:#F4F7FC}
.card[data-room="Adventure"]{background:#FBF7EF}
.card[data-room="Innovation"]{background:#F2F9F4}
.roomdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.cardhead{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.time{font-weight:800;font-size:15px;color:var(--p2)}
.time .tend{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.gname{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.gname .prog{color:var(--p);background:#f2ecfb;border-radius:5px;padding:1px 6px;margin-left:4px;font-size:11px}
.title{font-weight:800;font-size:14px}
.title.muted{color:var(--muted);font-weight:700}
.ltitle{font-size:13px;color:var(--text);margin-top:1px}
.unit{font-size:11px;color:var(--muted);margin-top:2px}
.meta{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.arrow{display:inline-block;margin-left:6px;color:var(--p);font-size:18px;font-weight:700;transition:transform .15s}
.card.open .arrow{transform:rotate(90deg)}
.detail{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.card.open .detail{display:block}
.field{margin-top:12px}
.flabel{font-size:11px;font-weight:700;color:var(--p);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.frow{display:flex;gap:8px;align-items:flex-start}
.fval{flex:1;background:#faf8fe;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45;white-space:pre-wrap}
.copy{flex-shrink:0;background:var(--p);color:#fff;border:none;border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer}
.copy.ok{background:var(--ok)}
.donebox{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;user-select:none}
.donebox input{width:18px;height:18px;accent-color:var(--ok)}
.planbtn{display:block;width:100%;margin-top:12px;background:linear-gradient(180deg,#7d54d6,#6C3FC5);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(108,63,197,.28)}
.planbtn:active{transform:translateY(1px)}
/* оверлей плана урока */
#planview{position:fixed;inset:0;z-index:50;background:rgba(26,16,38,.55);backdrop-filter:blur(2px);display:none}
#planview.show{display:flex;flex-direction:column}
.planbar{background:var(--p);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;flex-shrink:0}
.planbar b{font-size:14px;font-weight:800;flex:1}
.planbar button{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
#planframe{flex:1;width:100%;border:none;background:#fff}
footer{text-align:center;color:var(--muted);font-size:11px;padding:0 12px 30px}
/* раздел «Программы» */
#progview{position:fixed;inset:0;z-index:49;background:var(--bg);display:none;flex-direction:column}
#progview.show{display:flex}
#progbody{flex:1;overflow:auto;padding:14px;max-width:760px;margin:0 auto;width:100%}
.progcard{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(108,63,197,.08);border-left:4px solid var(--p);padding:14px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.progcard b{font-size:15px}.progcard .c{font-size:12px;color:var(--muted);white-space:nowrap}
.secrow{font-weight:800;color:var(--p);margin:16px 0 8px;font-size:13px}
/* фильтры педагог/кабинет + неделя */
.filters{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(108,63,197,.08);padding:8px 10px;margin-bottom:12px}
.frow2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:3px 0;font-size:14px}
.fchip{font-family:inherit;border:1.5px solid var(--line);background:#faf8fe;color:var(--text);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.fchip.on{background:var(--p);border-color:var(--p);color:#fff}
.fchip.wk{margin-left:auto;background:#fff7df;border-color:#f0dd9a;color:#7a5b00}
.fchip.wk.on{background:var(--y);border-color:var(--y);color:#4A2E85}
/* вид «по кабинетам»: колонки параллельных групп */
.roomcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;align-items:start}
@media(max-width:760px){.roomcols{display:flex;overflow-x:auto;gap:10px;padding-bottom:8px;-webkit-overflow-scrolling:touch}
 .roomcols .roomcol{flex:0 0 82vw}}
.roomcol{min-width:0}
.roomhead{font-weight:800;font-size:13px;background:#fff;border-radius:10px;border-left:4px solid var(--p);padding:8px 12px;margin-bottom:8px;box-shadow:0 1px 8px rgba(108,63,197,.07)}
.wkday{font-weight:800;color:var(--p);margin:14px 2px 6px;font-size:13px}
.wkrow{background:#fff;border-radius:10px;border-left:4px solid var(--p);box-shadow:0 1px 8px rgba(108,63,197,.07);padding:9px 12px;margin-bottom:6px;cursor:pointer}
.wkr1{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wkmeta{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.wkl{font-size:12px;color:var(--muted);margin-top:3px}
/* панель учителя: напоминания письма/отчёты */
.remind{border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px;line-height:1.45}
.remind.letter{background:#fff7df;border:1px solid #f0dd9a;color:#7a5b00}
.remind.report{background:#eefaf1;border:1px solid #bfe8cc;color:#1e6b3a}
.rembtn{display:inline-block;margin-left:6px;background:var(--p);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.progtools{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.toolbtn{flex:1;min-width:180px;text-align:center;background:#fff;border:2px solid var(--p);color:var(--p);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:800;text-decoration:none;box-shadow:0 2px 10px rgba(108,63,197,.12)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🙂</div>
    <div><h1>Speak&amp;Smile · Сегодня</h1><div class="sub">Группы на день · план урока · копирование в BigBen</div></div>
  </div>
  <div class="nav">
    <button class="arrowbtn" id="prev">‹</button>
    <div class="dayhead"><span id="dayhead">—</span><span class="wl" id="weeklabel"></span></div>
    <button class="arrowbtn" id="next">›</button>
    <button class="today" id="todaybtn">Сегодня</button>
    <input type="date" id="datepick">
    <button class="today" id="progbtn">📚 Программы</button>
  </div>
</header>
<main><div id="day"></div></main>
<footer>Speak&amp;Smile · Teaching Hub · 14 программ · расписание: <span id="srcnote">встроенное</span> · отметки «внесено» хранятся локально</footer>

<div id="progview">
  <div class="planbar">
    <button id="progback" style="display:none">‹ Назад</button>
    <b id="progtitle">📚 Программы</b>
    <button id="progclose">Закрыть ✕</button>
  </div>
  <div id="progbody"></div>
</div>

<div id="planview">
  <div class="planbar">
    <b>📋 План урока</b>
    <button id="planopen">Открыть в новой вкладке ↗</button>
    <button id="planclose">Закрыть ✕</button>
  </div>
  <iframe id="planframe" src="about:blank" title="План урока"></iframe>
</div>

<script src="data.js"></script>
<script src="plans.js"></script>
<script src="app.js"></script>
<script>
document.getElementById("planclose").addEventListener("click", closePlan);
document.getElementById("planopen").addEventListener("click", ()=>{
  const src=document.getElementById("planframe").getAttribute("src");
  if(src && src!=="about:blank") window.open(src,"_blank");
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closePlan(); });
document.getElementById("progbtn").addEventListener("click", openProg);
document.getElementById("progback").addEventListener("click", renderProgList);
document.getElementById("progclose").addEventListener("click", ()=>{ document.getElementById("progview").classList.remove("show"); document.body.style.overflow=""; });
</script>
<script>
// Регистрируем service worker только при работе через сервер (http/https), не через file://
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
