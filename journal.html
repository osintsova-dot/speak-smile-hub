<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak&amp;Smile · Журналы наблюдений</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--p:#6C3FC5;--y:#F5C842;--ink:#23203a;--mut:#6b6785;--line:#d7d2e8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PT Sans",Arial,sans-serif;color:var(--ink);background:#f6f4fb}

/* ---------- панель управления (на печать не идёт) ---------- */
.bar{position:sticky;top:0;z-index:9;background:var(--p);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 12px rgba(108,63,197,.25)}
.bar h1{font-size:16px;margin:0 10px 0 0;font-weight:800;white-space:nowrap}
.bar select,.bar button{font:inherit;font-size:14px;border:none;border-radius:9px;padding:9px 12px;cursor:pointer}
.bar select{background:#fff;color:var(--ink);max-width:230px}
.bar button{background:rgba(255,255,255,.18);color:#fff;font-weight:700}
.bar button.main{background:var(--y);color:#4A2E85}
.bar button:disabled{opacity:.6;cursor:default}
.bar .sp{flex:1}
.note{font-size:12px;opacity:.9;white-space:nowrap}
.msg{padding:10px 14px;font-size:13px;background:#FFF6DC;border-bottom:1px solid #f0e2b5;color:#5a4a12}
.msg.err{background:#ffe9e9;border-color:#f3c9c9;color:#8a2020}
.msg:empty{display:none}
.hint{padding:12px 14px;font-size:13px;color:var(--mut)}

/* ---------- лист журнала ---------- */
#out{padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pg{width:281mm;min-height:194mm;background:#fff;padding:8mm;box-shadow:0 3px 16px rgba(35,32,58,.14);display:flex;flex-direction:column}
.ph{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--p);padding-bottom:4px}
.ph .brand{font-weight:700;color:var(--p);font-size:11px}
.ph .blk{font-weight:700;font-size:13px;flex:1}
.ph .meta{font-size:10px;color:var(--mut);white-space:nowrap}
.line{display:flex;gap:18px;font-size:10.5px;margin:5px 0 3px}
.key{font-size:9px;color:var(--mut);margin-bottom:4px}
table.j{width:100%;border-collapse:collapse;table-layout:fixed}
table.j th,table.j td{border:1px solid #c9c4dd;height:10.6mm;font-size:10px}
table.j thead th{background:#f3efff;font-weight:700;font-size:9.5px;height:7mm}
th.num,td.num{width:8mm;text-align:center;color:#8a86a0}
th.nm,td.nm{width:52mm;padding:0 4px;text-align:left;font-size:10.5px}
th.note,td.note{width:62mm}
.test{background:#FFF6DC}
thead .test{background:var(--y)}
.notes{margin-top:5px}
.nt{font-size:9.5px;font-weight:700;color:var(--p);margin-bottom:3px}
.dts{display:grid;grid-template-columns:repeat(4,1fr);gap:3px 10px}
.dt{font-size:9px;border-bottom:1px dotted #c9c4dd;padding-bottom:2px}
.blank{display:inline-block;width:22mm;border-bottom:1px solid #8a86a0}
.tp{color:#8a86a0;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf{margin-top:auto;padding-top:3px;border-top:1px solid #e4e0f0;font-size:8.5px;color:#8a86a0}

/* обложка */
.cover .c-top{text-align:center;padding:6mm 0 4mm;border-bottom:3px solid var(--y)}
.c-brand{color:var(--p);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.cover h2{font-size:34px;margin:4px 0 2px}
.c-prog{font-size:17px;font-weight:700;color:var(--p)}
.c-year{font-size:11px;color:var(--mut);margin-top:3px}
.c-grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:5mm}
.c-card{border:1px solid var(--line);border-radius:6px;padding:4mm 5mm}
.c-card.wide{margin-top:5mm}
.c-t{font-weight:700;color:var(--p);font-size:11px;margin-bottom:3px}
.c-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:2.2mm 0;border-bottom:1px dotted var(--line)}
.c-row:last-child{border-bottom:0}
.c-row span{color:var(--mut)}
.c-names{list-style:none;margin:0;padding:0;columns:2;font-size:10.5px}
.c-names li{display:flex;gap:6px;padding:.6mm 0;break-inside:avoid}
.c-names li span{color:#8a86a0;min-width:14px}
.c-blocks{margin:0;padding-left:16px;font-size:10px;columns:3}
.c-blocks li{padding:.7mm 0;break-inside:avoid}
.c-blocks li span{display:block;color:#8a86a0;font-size:9px}

@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff}
  .bar,.msg,.hint{display:none!important}
  #out{padding:0;gap:0}
  .pg{width:auto;min-height:0;height:194mm;box-shadow:none;padding:0;page-break-after:always;overflow:hidden}
  .pg:last-child{page-break-after:auto}
}
</style>
</head>
<body>

<div class="bar">
  <h1>📓 Журналы наблюдений</h1>
  <select id="group"></select>
  <select id="block"></select>
  <button class="main" id="print">🖨 Печать</button>
  <div class="sp"></div>
  <span class="note" id="rosterNote">—</span>
  <button id="refresh">↻ Обновить списки из CRM</button>
  <button id="back" title="Вернуться в Хаб">← Хаб</button>
</div>
<div class="msg" id="msg"></div>
<div class="hint" id="hint"></div>
<div id="out"></div>

<script src="data.js?v=121"></script>
<script src="journal-data.js?v=121"></script>
<script>
"use strict";

const WORKER = "https://ss-bb.o-sintsova.workers.dev";
const LS_ROSTERS = "ss_journal_rosters";   // {at, groups:{имя из CRM: [ученики]}}
const LS_TOKEN = "bbToken";                // тот же код, что у калькулятора зарплат

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* --- сопоставление названий: «Give me five 3B» ↔ «GMF 3B» --- */
const CYR = { А:"A", В:"B", С:"C", Е:"E", К:"K", М:"M", Н:"H", Р:"P", Т:"T", Х:"X" };
function key(name) {
  let s = String(name || "").trim().toLowerCase();
  s = s.replace(/give me five/, "gmf").replace(/genki english/, "genki").replace(/mimi'?s? wheel/, "mimi");
  s = s.replace(/[^a-zа-я0-9]/gi, "");
  s = s.replace(/[а-я]/g, (c) => (CYR[c.toUpperCase()] || c).toLowerCase());
  s = s.replace(/^(prepare\d)$/, "$1a").replace(/^gateway$/, "gatewayb2");
  return s;
}

/* --- данные --- */
const GROUPS = window.JOURNAL_GROUPS || [];
function loadRosters() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_ROSTERS) || "null");
    if (saved && saved.groups) return saved;
  } catch (e) {}
  return window.JOURNAL_ROSTERS || { at: null, groups: {} };
}
let ROSTERS = loadRosters();

function pupilsFor(group) {
  const k = key(group.name);
  for (const [crmName, list] of Object.entries(ROSTERS.groups || {})) {
    if (key(crmName) === k) return list || [];
  }
  return [];
}

/* --- структура курса --- */
const MONTHS = ["","Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const monthOf = (week) => { const m = String(week || "").match(/\d{2}\.(\d{2})/); return m ? +m[1] : 0; };
function blocksOf(program) {
  const lessons = (window.PROGRAMS[program] || {}).lessons || [];
  const out = [];
  for (const l of lessons) {
    const s = (l.sec || l.unit || "").trim();
    const last = out[out.length - 1];
    if (!last || last.sec !== s) out.push({ sec: s, lessons: [l] });
    else last.lessons.push(l);
  }
  return out.map((b) => ({
    ...b,
    monthLabel: [...new Set(b.lessons.map((l) => monthOf(l.week)).filter(Boolean))].map((m) => MONTHS[m]).join("–"),
  }));
}
const isTest = (l) => /тест|test|экзамен|exam|контрольн/i.test((l.type || "") + " " + (l.title || ""));
const DAYS = ["","Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const YEAR = "2026 / 2027";

/* --- разметка --- */
function pageHtml(group, prog, block, i, total, pupils) {
  const cols = block.lessons;
  const rows = Math.max(pupils.length + 2, 12);
  const head = cols.map((l) => `<th class="l${isTest(l) ? " test" : ""}">У${l.n}</th>`).join("");
  const body = Array.from({ length: rows }, (_, r) =>
    `<tr><td class="num">${r + 1}</td><td class="nm">${pupils[r] ? esc(pupils[r]) : ""}</td>` +
    cols.map((l) => `<td class="mark${isTest(l) ? " test" : ""}"></td>`).join("") +
    `<td class="note"></td></tr>`
  ).join("");
  const dates = cols.map((l) =>
    `<div class="dt"><b>Урок ${l.n}${isTest(l) ? " · ТЕСТ" : ""}</b> дата: <span class="blank"></span>` +
    `<div class="tp">${esc(l.title || l.type || "")}</div></div>`
  ).join("");
  return `<section class="pg">
  <header class="ph">
    <div class="brand">Speak&amp;Smile · ${esc(prog.label)}</div>
    <div class="blk">${esc(block.sec)}</div>
    <div class="meta">Уроки ${cols[0].n}–${cols[cols.length - 1].n} · ${esc(block.monthLabel)}</div>
  </header>
  <div class="line"><span>Группа: <b>${esc(group.name)}</b></span><span>Педагог: <b>${esc(group.teacher)}</b></span>
    <span>Кабинет: <b>${esc(group.room)}</b></span><span>Год: <b>${YEAR}</b></span></div>
  <div class="key">✓ присутствовал, активен &nbsp;·&nbsp; – пассивен &nbsp;·&nbsp; н не был &nbsp;·&nbsp; ! заметка по ученику</div>
  <table class="j"><thead><tr><th class="num">№</th><th class="nm">Фамилия, имя</th>${head}<th class="note">Заметки по ученику</th></tr></thead><tbody>${body}</tbody></table>
  <div class="notes"><div class="nt">Заметки по урокам</div><div class="dts">${dates}</div></div>
  <footer class="pf">Speak&amp;Smile · ${esc(prog.label)} · ${esc(block.sec)} · стр. ${i + 1} из ${total}</footer>
</section>`;
}

function coverHtml(group, prog, blocks, pupils) {
  const list = blocks.map((b) =>
    `<li><b>${esc(b.sec)}</b><span>уроки ${b.lessons[0].n}–${b.lessons[b.lessons.length - 1].n} · ${esc(b.monthLabel)}</span></li>`
  ).join("");
  const names = pupils.length
    ? pupils.map((p, i) => `<li><span>${i + 1}</span>${esc(p)}</li>`).join("")
    : `<li style="color:#8a86a0">список пуст — нажми «Обновить списки из CRM»</li>`;
  return `<section class="pg cover">
  <div class="c-top">
    <div class="c-brand">Speak&amp;Smile · школа английского языка</div>
    <h2>Журнал наблюдений</h2>
    <div class="c-prog">${esc(prog.label)}</div>
    <div class="c-year">Сентябрь — Май · 72 урока · учебный год ${YEAR}</div>
  </div>
  <div class="c-grid">
    <div class="c-card">
      <div class="c-row"><span>Группа</span><b>${esc(group.name)}</b></div>
      <div class="c-row"><span>Педагог</span><b>${esc(group.teacher)}</b></div>
      <div class="c-row"><span>Кабинет</span><b>${esc(group.room)}</b></div>
      <div class="c-row"><span>Расписание</span><b>${esc((group.days || []).map((d) => DAYS[d.d] + " " + d.t).join(" · "))}</b></div>
      <div class="c-row"><span>Учеников</span><b>${pupils.length}</b></div>
    </div>
    <div class="c-card"><div class="c-t">Список группы</div><ol class="c-names">${names}</ol></div>
  </div>
  <div class="c-card wide"><div class="c-t">Содержание</div><ol class="c-blocks">${list}</ol></div>
  <footer class="pf">Speak&amp;Smile · Give yourself five reasons to smile · список из CRM${ROSTERS.at ? " от " + fmtDate(ROSTERS.at) : ""}</footer>
</section>`;
}

const fmtDate = (iso) => {
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) +
    ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
};

/* --- отрисовка --- */
function currentGroup() { return GROUPS[+$("group").value] || GROUPS[0]; }

function fillBlocks() {
  const g = currentGroup();
  const blocks = blocksOf(g.program);
  const sel = $("block");
  const keep = sel.value;
  sel.innerHTML = `<option value="all">Весь журнал (${blocks.length + 1} стр.)</option>` +
    `<option value="cover">Только обложка</option>` +
    blocks.map((b, i) => `<option value="${i}">${esc(b.sec)}</option>`).join("");
  sel.value = [...sel.options].some((o) => o.value === keep) ? keep : "all";
}

function render() {
  const g = currentGroup();
  const prog = window.PROGRAMS[g.program];
  if (!prog) { $("out").innerHTML = ""; $("hint").textContent = "Нет программы " + g.program; return; }
  const pupils = pupilsFor(g);
  const blocks = blocksOf(g.program);
  const which = $("block").value;
  let html = "";
  if (which === "all") html = coverHtml(g, prog, blocks, pupils) + blocks.map((b, i) => pageHtml(g, prog, b, i, blocks.length, pupils)).join("");
  else if (which === "cover") html = coverHtml(g, prog, blocks, pupils);
  else { const i = +which; html = pageHtml(g, prog, blocks[i], i, blocks.length, pupils); }
  $("out").innerHTML = html;
  $("hint").textContent = pupils.length
    ? `${g.name} · ${prog.label} · ${pupils.length} учеников · печать A4 альбомная`
    : `${g.name}: список пуст. Нажми «Обновить списки из CRM» — фамилии подставятся сами.`;
  localStorage.setItem("ss_journal_last", g.name);
}

function setNote() {
  $("rosterNote").textContent = ROSTERS.at ? "списки от " + fmtDate(ROSTERS.at) : "списки не обновлялись";
}

/* --- обновление из CRM --- */
async function refresh() {
  const btn = $("refresh");
  let token = localStorage.getItem(LS_TOKEN) || "";
  if (!token) {
    token = (prompt("Код доступа (тот же, что в калькуляторе зарплат):") || "").trim();
    if (!token) return;
    localStorage.setItem(LS_TOKEN, token);
  }
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = "↻ Спрашиваю CRM…";
  $("msg").className = "msg";
  $("msg").textContent = "Захожу в BigBen и собираю составы всех групп — это занимает до минуты.";
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 90000);
  try {
    const r = await fetch(WORKER + "/roster?t=" + encodeURIComponent(token), { signal: ctrl.signal });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "CRM не ответила");
    const groups = {};
    (d.groups || []).forEach((g) => { groups[g.name] = g.pupils || []; });
    ROSTERS = { at: d.at || new Date().toISOString(), groups };
    localStorage.setItem(LS_ROSTERS, JSON.stringify(ROSTERS));
    const total = Object.values(groups).reduce((s, v) => s + v.length, 0);
    $("msg").textContent = `Готово: ${Object.keys(groups).length} групп, ${total} учеников. Списки обновлены.`;
    setNote();
    render();
  } catch (e) {
    const aborted = e && e.name === "AbortError";
    $("msg").className = "msg err";
    $("msg").textContent = aborted
      ? "CRM не ответила за полторы минуты. Если ты без VPN — включи его и повтори: Cloudflare из России часто не пускает."
      : "Не вышло: " + ((e && e.message) || e) + ". Если код неверный — очисти его кнопкой ниже и введи заново.";
    if (!aborted && /код не совпал/i.test(String(e && e.message))) localStorage.removeItem(LS_TOKEN);
  } finally {
    clearTimeout(timer);
    btn.disabled = false;
    btn.textContent = was;
  }
}

/* --- старт --- */
$("group").innerHTML = GROUPS.map((g, i) => `<option value="${i}">${esc(g.name)} · ${esc(g.teacher)}</option>`).join("");
const last = localStorage.getItem("ss_journal_last");
if (last) { const i = GROUPS.findIndex((g) => g.name === last); if (i >= 0) $("group").value = i; }
fillBlocks();
setNote();
render();

$("group").addEventListener("change", () => { fillBlocks(); render(); });
$("block").addEventListener("change", render);
$("print").addEventListener("click", () => window.print());
$("refresh").addEventListener("click", refresh);
$("back").addEventListener("click", () => { location.href = "index.html"; });
</script>
</body>
</html>
