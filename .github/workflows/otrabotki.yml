# Утренний сбор Speak&Smile — обновляет калькулятор ЗП и отработки.
#
# Зачем: собственный cron воркера ss-bb ненадёжно доходит до поздних стадий
# (сбор выручки/финансов/отработок), а с 14.09 BigBen сделал отчёты асинхронными.
# Эти внешние held-запросы бьют по стадиям напрямую и не зависят от наших серверов.
#
# Стадии (каждая — отдельный held-запрос к воркеру):
#   warm — вход в BigBen (реальный ~80с), кладёт сессию
#   pull — выручка по группам (снимок калькулятора ЗП, с ретраями от SPA-заглушки)
#   fin  — «реально пришло / расходы» (отдельный медленный источник)
#   otr  — отработки: очередь пропустивших + оплата Инге
#
# Токен (код "awesome", он же код обновления калькулятора) — в секрете репозитория
# SS_TICK_TOKEN; в логах GitHub маскирует его как ***.
name: Утренний сбор — калькулятор и отработки

on:
  schedule:
    # 05:30 UTC ≈ 12:30 по Норильску. GitHub может задержать старт на 5–15 мин — не критично.
    - cron: '30 5 * * *'
  workflow_dispatch:   # ручной запуск кнопкой Run workflow

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Прогрев — логин в BigBen
        run: |
          curl -sS --max-time 150 \
            "https://ss-bb.o-sintsova.workers.dev/tick-7a3f9c2e51?do=warm&t=${{ secrets.SS_TICK_TOKEN }}"
          echo

      - name: Выручка по группам (снимок калькулятора)
        run: |
          curl -sS --max-time 290 \
            "https://ss-bb.o-sintsova.workers.dev/tick-7a3f9c2e51?do=pull&t=${{ secrets.SS_TICK_TOKEN }}"
          echo

      - name: Реально пришло / расходы
        continue-on-error: true   # финансы иногда флапают сетью — не роняем весь прогон
        run: |
          curl -sS --max-time 290 \
            "https://ss-bb.o-sintsova.workers.dev/tick-7a3f9c2e51?do=fin&t=${{ secrets.SS_TICK_TOKEN }}"
          echo

      - name: Отработки — пропустившие + оплата
        run: |
          curl -sS --max-time 290 \
            "https://ss-bb.o-sintsova.workers.dev/tick-7a3f9c2e51?do=otr&t=${{ secrets.SS_TICK_TOKEN }}"
          echo
